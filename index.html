<html lang="en">

<head>
  <!-- Required meta tags for Bootstrap and JQuery -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Movie Project</title>

  <!-- CSS imports -->
  <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.0/themes/ui-lightness/jquery-ui.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.0/css/bootstrap.css">
  <link rel ="stylesheet" href="style.css" type="text/css">

  <!-- JS Imports -->
  <script src="https://code.jquery.com/jquery-3.3.1.js"></script>
  <script src="https://code.jquery.com/ui/1.12.0/jquery-ui.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.0/umd/popper.js"></script>
  <!-- Rename the JQueryUI 'tooltip' and 'button' classes to 'uitooltip' and 'uibutton' so that they won't conflict with Bootstrap's 'tooltip' and 'button' classes. -->
  <script>
    $.widget.bridge('uitooltip', $.ui.tooltip);
    $.widget.bridge('uibutton', $.ui.button);
  </script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.0/js/bootstrap.js"></script>
  <script type="text/javascript"  src="script.js"></script>
  
</head>

<body>
  <div class = "container-fluid"  id = "movie-tabs">
    
     <ul class="nav nav-tabs" id="my-tabs">
        <li class="nav-item">
          <a class="nav-link active" href="#brief-view" data-toggle="tab">Brief View</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#detailed-view" data-toggle="tab">Detailed View</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#reception" data-toggle="tab">Critical Reception</a>
        </li>
      </ul>
  
     <div class="tab-content" id ="my-content">
        <div class="tab-pane fade show active" id="brief-view"> 
          <table class="table table-striped">
            <thead>
              <tr>
                <th scope="col">Poster</th>
                <th scope="col">Title</th>
                <th scope="col">Year</th>
              </tr>
            </thead>
            <tbody>
              
            </tbody>
          </table>

        </div>

        <div class="tab-pane fade" id="detailed-view">  </div>
        <div class="tab-pane fade" id="reception">

          <table class="table table-striped">
            <thead>
              <tr>
                <th scope="col">Poster</th>
                <th scope="col">IMDb Score</th>
                <th scope="col">Rotten Tomatoes</th>
                <th scope="col">Metacritic</th>
                <th scope="col">Awardsc</th>
              </tr>
            </thead>
            <tbody>
            
            </tbody>
          </table>

        </div>
     </div>

  </div>  
</body>

</html>
